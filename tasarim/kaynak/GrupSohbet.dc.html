<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Lykiva — Grup sohbeti</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B04E25}a:hover{color:#8A3C1C}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2EDE3; color: #16201B; font-family: Inter, system-ui, sans-serif; box-sizing: border-box; display: flex; flex-direction: column">

  <header style="padding: 50px 8px 8px; display: flex; align-items: center; gap: 8px; background: #FBF8F2; border-bottom: 1px solid #E3DACB">
    <a href="Grup.dc.html" aria-label="Geri" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16201B"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <span style="width: 40px; height: 40px; border-radius: 12px; background: #0B6A6A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">PK</span>
    <div style="flex: 1; min-width: 0">
      <div style="font-size: 16px; font-weight: 700">Pedal Kaş</div>
      <div style="font-size: 12px; color: #0B6A6A; font-weight: 600">2 kişi şu an yolda</div>
    </div>
    <a href="CanliHarita.dc.html" aria-label="Canlı haritayı aç" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #16201B"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></a>
  </header>

  <a href="EtkinlikDetay.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #F1DCCD; color: #5E2810; text-decoration: none; font-size: 13px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
    <span style="flex: 1"><strong>Sabitlendi:</strong> Gün doğumu sürüşü · Cmt 06:45</span>
    <span style="font-weight: 700">9 katılımcı</span>
  </a>

  <div style="flex: 1; overflow: hidden; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 11px; color: #4F5751; text-align: center; font-weight: 600">Bugün</div>

    <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 300px">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #D3E8E4; color: #0B4F4F; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0">MK</span>
      <div>
        <div style="font-size: 11px; color: #4F5751; margin: 0 0 3px 4px">Mert</div>
        <a href="RotaDetay.dc.html" style="display: block; width: 240px; border-radius: 16px 16px 16px 4px; background: #FBF8F2; border: 1px solid #E3DACB; overflow: hidden; text-decoration: none; color: #16201B">
          <svg viewBox="0 0 240 90" width="240" height="90" aria-hidden="true" style="display: block"><rect width="240" height="90" fill="#E8E0CF"/><path d="M0 64 C 50 56, 90 76, 140 82 S 210 78, 240 70 L240 90 L0 90Z" fill="#CBE1DC"/><path d="M14 66 C 40 56, 60 40, 96 44 S 150 52, 176 34 S 214 18, 228 26" fill="none" stroke="#B04E25" stroke-width="3.5" stroke-linecap="round"/></svg>
          <div style="padding: 10px 12px">
            <div style="font-size: 14px; font-weight: 700">Kaş – Patara sahil turu</div>
            <div style="font-size: 12px; color: #4F5751">44 km · ↑ 610 m · Rota</div>
          </div>
        </a>
      </div>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 300px">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #D3E8E4; color: #0B4F4F; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0">MK</span>
      <div style="padding: 10px 12px; border-radius: 16px 16px 16px 4px; background: #FBF8F2; border: 1px solid #E3DACB; font-size: 14px; line-height: 1.4">Haftaya bunu yapalım mı? Patara'da kahvaltı molası verelim.</div>
    </div>

    <div style="display: flex; gap: 8px; align-items: flex-end; max-width: 300px">
      <span style="width: 28px; height: 28px; border-radius: 14px; background: #F1DCCD; color: #7A3416; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0">DE</span>
      <div>
        <div style="font-size: 11px; color: #4F5751; margin: 0 0 3px 4px">Deniz</div>
        <div style="width: 240px; padding: 12px; border-radius: 16px 16px 16px 4px; background: #16201B; color: #F2EDE3; box-sizing: border-box">
          <div style="font-size: 11px; color: #B9C2BA; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em">Anket</div>
          <div style="font-size: 14px; font-weight: 700; margin: 4px 0 10px">Hangi gün?</div>
          <div style="height: 34px; border-radius: 10px; background: #2A3631; position: relative; overflow: hidden; margin-bottom: 6px"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 70%; background: #0B6A6A"></span><span style="position: relative; display: flex; justify-content: space-between; align-items: center; height: 100%; padding: 0 10px; font-size: 13px; font-weight: 600"><span>Cumartesi</span><span>7</span></span></div>
          <div style="height: 34px; border-radius: 10px; background: #2A3631; position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: #3E4A44"></span><span style="position: relative; display: flex; justify-content: space-between; align-items: center; height: 100%; padding: 0 10px; font-size: 13px; font-weight: 600"><span>Pazar</span><span>3</span></span></div>
        </div>
      </div>
    </div>

    <sc-for list="{{mine}}" as="m" hint-placeholder-count="1">
      <div style="align-self: flex-end; max-width: 260px; padding: 10px 12px; border-radius: 16px 16px 4px 16px; background: #B04E25; color: #FFFFFF; font-size: 14px; line-height: 1.4">{{m.text}}</div>
    </sc-for>
  </div>

  <div style="padding: 8px 10px 30px; background: #FBF8F2; border-top: 1px solid #E3DACB; display: flex; align-items: center; gap: 6px">
    <button aria-label="Rota, etkinlik veya konum ekle" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F2EDE3; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <label style="flex: 1; height: 44px; border-radius: 22px; background: #F2EDE3; display: flex; align-items: center; padding: 0 14px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mesaj</span>
      <input value="{{draft}}" onInput="{{onDraft}}" placeholder="Mesaj yaz…" style="flex: 1; border: 0; background: transparent; font-size: 14px; outline: none; color: #16201B; min-width: 0">
    </label>
    <button aria-label="Gönder" onClick="{{send}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #B04E25; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-3-6z"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: '', mine: ['Cumartesi olur, ben varım!'] };
  }
  renderVals() {
    return {
      draft: this.state.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => {
        const t = this.state.draft.trim();
        if (!t) return;
        this.setState({ mine: [...this.state.mine, t], draft: '' });
      },
      mine: this.state.mine.slice(-3).map((text) => ({ text }))
    };
  }
}
</script>
</body>
</html>
