<script>
(function () {
  const el = document.getElementById('olcek'), W = 1080, H = 1920;
  const sigdir = () => {
    const k = Math.min(innerWidth / W, innerHeight / H);
    el.style.transform = 'scale(' + k + ')';
    el.style.left = ((innerWidth - W * k) / 2) + 'px';
    el.style.top = ((innerHeight - H * k) / 2) + 'px';
  };
  addEventListener('resize', sigdir); sigdir();
})();
</script>
