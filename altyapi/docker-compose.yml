# Lykiva — kendi rota (BRouter) ve yer arama (Photon) sunucularımız.
# Coolify > yeni kaynak > Docker Compose (Git deposu: bu repo, dosya: altyapi/docker-compose.yml).
# Dışarıya yalnızca "kapi" açılır: Coolify'da iki alan adı da kapi servisine verilir
# (https://brouter.ismailtopcam.dev,https://photon.ismailtopcam.dev; geçiş süresince eski *.lykiva.app adları da). brouter ve photon'a alan adı VERİLMEZ.
# Kapı uygulama anahtarını (X-Lykiva-Anahtar) ve IP başına istek sınırını denetler. Ayrıntı: altyapi/README.md
services:
  kapi:
    build: ./kapi
    restart: unless-stopped
    environment:
      # Zorunlu; Coolify'da girilir, repoya yazılmaz. Uygulamadaki EXPO_PUBLIC_ALTYAPI_ANAHTARI ile aynı olmalı.
      - LYKIVA_UYGULAMA_ANAHTARI=${LYKIVA_UYGULAMA_ANAHTARI}
      # IP başına: rota isteği dakikada 60 (anlık 30 fazlası), arama dakikada 120 (anlık 40)
      - LYKIVA_ROTA_SINIRI=${LYKIVA_ROTA_SINIRI:-60r/m}
      - LYKIVA_ROTA_YIGIN=${LYKIVA_ROTA_YIGIN:-30}
      - LYKIVA_ARAMA_SINIRI=${LYKIVA_ARAMA_SINIRI:-120r/m}
      - LYKIVA_ARAMA_YIGIN=${LYKIVA_ARAMA_YIGIN:-40}
      # Şablonda yalnızca LYKIVA_ ile başlayan değişkenler doldurulsun
      - NGINX_ENVSUBST_FILTER=^LYKIVA_
    expose:
      - '80'

  brouter:
    build: ./brouter
    restart: unless-stopped
    environment:
      - BROUTER_BELLEK=${BROUTER_BELLEK:-512M}
      - BROUTER_ISLEM=${BROUTER_ISLEM:-4}
      - BROUTER_ZAMAN_ASIMI=${BROUTER_ZAMAN_ASIMI:-60}
      - BROUTER_SEGMENTLER=${BROUTER_SEGMENTLER:-E25_N35 E30_N35 E35_N35 E40_N35 E25_N40 E30_N40 E35_N40 E40_N40}
    volumes:
      - brouter-segmentler:/segments
    expose:
      - '17777'

  photon:
    build: ./photon
    restart: unless-stopped
    environment:
      - PHOTON_BELLEK=${PHOTON_BELLEK:-2g}
      - PHOTON_DILLER=${PHOTON_DILLER:-tr,en}
    volumes:
      - photon-veri:/veri
    expose:
      - '2322'

volumes:
  brouter-segmentler:
  photon-veri:
