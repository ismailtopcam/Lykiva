# Lykiva — kendi rota (BRouter), yer arama (Photon) ve 3B kart video (kart-video) sunucularımız.
# Coolify > yeni kaynak > Docker Compose (Git deposu: bu repo, dosya: altyapi/docker-compose.yml).
# Dışarıya yalnızca "kapi" açılır: Coolify'da bütün alan adları kapi servisine verilir
# (https://brouter.ismailtopcam.dev,https://photon.ismailtopcam.dev,https://video.ismailtopcam.dev).
# brouter, photon ve kart-video'ya alan adı VERİLMEZ.
# Kapı uygulama anahtarını (X-Lykiva-Anahtar) ve IP başına istek sınırını denetler. Ayrıntı: altyapi/README.md
services:
  kapi:
    build: ./kapi
    restart: unless-stopped
    environment:
      # Zorunlu; Coolify'da girilir, repoya yazılmaz. Uygulamadaki EXPO_PUBLIC_ALTYAPI_ANAHTARI ile aynı olmalı.
      - LYKIVA_UYGULAMA_ANAHTARI=${LYKIVA_UYGULAMA_ANAHTARI}
      # IP başına: rota isteği dakikada 60 (anlık 30 fazlası), arama dakikada 120 (anlık 40)
      - LYKIVA_ROTA_SINIRI=${LYKIVA_ROTA_SINIRI:-60r/m}
      - LYKIVA_ROTA_YIGIN=${LYKIVA_ROTA_YIGIN:-30}
      - LYKIVA_ARAMA_SINIRI=${LYKIVA_ARAMA_SINIRI:-120r/m}
      - LYKIVA_ARAMA_YIGIN=${LYKIVA_ARAMA_YIGIN:-40}
      # Video: yeni iş dakikada 1 (anlık 4 fazlası); durum sorgusu ve indirme dakikada 60 (anlık 30)
      - LYKIVA_VIDEO_SINIRI=${LYKIVA_VIDEO_SINIRI:-1r/m}
      - LYKIVA_VIDEO_YIGIN=${LYKIVA_VIDEO_YIGIN:-4}
      # Şablonda yalnızca LYKIVA_ ile başlayan değişkenler doldurulsun
      - NGINX_ENVSUBST_FILTER=^LYKIVA_
    expose:
      - '80'

  brouter:
    build: ./brouter
    restart: unless-stopped
    environment:
      - BROUTER_BELLEK=${BROUTER_BELLEK:-512M}
      - BROUTER_ISLEM=${BROUTER_ISLEM:-4}
      - BROUTER_ZAMAN_ASIMI=${BROUTER_ZAMAN_ASIMI:-60}
      - BROUTER_SEGMENTLER=${BROUTER_SEGMENTLER:-E25_N35 E30_N35 E35_N35 E40_N35 E25_N40 E30_N40 E35_N40 E40_N40}
    volumes:
      - brouter-segmentler:/segments
    expose:
      - '17777'

  photon:
    build: ./photon
    restart: unless-stopped
    environment:
      - PHOTON_BELLEK=${PHOTON_BELLEK:-2g}
      - PHOTON_DILLER=${PHOTON_DILLER:-tr,en}
    volumes:
      - photon-veri:/veri
    expose:
      - '2322'

  # 3B paylaşım kartı videoları (altyapi/kart-video/README.md). Sunucu diğer uygulamalarla ortak: işlemci ve bellek sınırlı.
  kart-video:
    build: ./kart-video
    restart: unless-stopped
    environment:
      # Hız ayarları: altyapi/kart-video/README.md > Hız (sunucuda ekran kartı yok)
      - KV_FPS=${KV_FPS:-24}
      - KV_OLCEK=${KV_OLCEK:-2}
      - KV_HARITA_ORAN=${KV_HARITA_ORAN:-0.75}
      - KV_ARAZI=${KV_ARAZI:-1}
      - KV_SAKLA_DK=${KV_SAKLA_DK:-60}
      - KV_EN_FAZLA_SIRA=${KV_EN_FAZLA_SIRA:-20}
    cpus: ${KV_ISLEMCI:-3}
    mem_limit: ${KV_BELLEK:-3g}
    # Chromium paylaşılan belleği kullanır; Docker'ın 64 MB varsayılanı yetmez
    shm_size: '1gb'
    expose:
      - '8080'

volumes:
  brouter-segmentler:
  photon-veri:
